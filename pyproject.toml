[project]
name = "anime-tools"
version = "0.1.0"
description = "Dataset curation for anime diffusion training: caption grammar + polishing, the Anima Tagger (dbv4), position clauses, multiview audit, PE-Spatial grouping, SAM3/MIT masking."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
# Base install: the caption grammar / correction / variants / index, torch-free.
dependencies = [
    "numpy>=2.0",
    "Pillow",
    "pyyaml",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "tqdm",
    "rich>=13",
]

[project.optional-dependencies]
# Anima Tagger (dbv4 caformer backbone via timm; GPL weights fetched from the gated upstream repo at load).
tagger = ["torch>=2.4", "timm>=1.0", "transformers>=4.45"]
# Tokenizer-length checks in the correction / position stages.
tokenizers = ["transformers>=4.45", "sentencepiece"]
# Position clauses + multiview audit (SAM3 subject detection, contact sheets).
stages = ["anime-tools[tagger,tokenizers]", "sam3 @ git+https://github.com/facebookresearch/sam3.git", "matplotlib"]
# Dataset grouping / near-twin features on PE-Spatial-B16-512 (vendored tower, weights fetched from the Hub at load).
grouping = ["torch>=2.4", "einops", "timm>=1.0"]
# SAM3 subject masks + MIT/ComicTextDetector text masks.
masking = ["torch>=2.4", "sam3 @ git+https://github.com/facebookresearch/sam3.git", "segmentation-models-pytorch>=0.3.4", "albumentations>=1.4.0", "opencv-python>=4.11"]  # onnxruntime(-gpu) optional: the CTD gate falls back to cv2.dnn without it; not pinned because onnxruntime vs onnxruntime-gpu conflict
all = ["anime-tools[stages,grouping,masking]"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist", "ruff"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anime_tools*"]

[tool.setuptools.package-data]
"anime_tools.captions" = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
