name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # CPU torch (the tagger/grouping/masking tests run on CPU; conftest blanks
      # CUDA_VISIBLE_DEVICES anyway).
      - run: uv sync --index https://download.pytorch.org/whl/cpu
      - run: uv run ruff format --check .
      # Lint rules live in the maintainer's user-level ruff config (see CLAUDE.md);
      # the default rule set here is advisory only.
      - run: uv run ruff check .
        continue-on-error: true
      - run: uv run pytest -q -n auto
      - uses: oven-sh/setup-bun@v2
      # Same prettier pass the pre-commit hook runs (scripts/hooks/pre-commit).
      - run: cd frontend && bun install --frozen-lockfile && bun run format:check
      # The built frontend (anime_tools/gui/static/) is committed -- the page and the
      # font beside it; fail if either drifts from frontend/.
      - run: scripts/build_frontend.sh
      - run: git diff --exit-code -- anime_tools/gui/static/
