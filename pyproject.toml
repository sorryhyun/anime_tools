[project]
name = "anime-tools"
version = "0.4.0"
description = "Dataset curation for anime diffusion training: caption grammar + polishing, the Anima Tagger (dbv4), position clauses, multiview audit, PE-Spatial grouping, SAM3/MIT masking."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "Pillow",
    "pyyaml",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "tqdm",
    "rich>=13",
    # Anima Tagger (dbv4 caformer backbone via timm; GPL weights fetched from the gated upstream repo at load)
    # + PE-Spatial grouping (vendored tower, weights fetched from the Hub at load).
    "torch>=2.12",
    "torchvision",
    "timm>=1.0",
    "einops",
    # The Danbooru wiki mirror (English tag descriptions) ships as one parquet;
    # `downloads.py`'s danbooru_tags_en row reads it directly rather than pulling
    # the whole `datasets` stack in for a single table.
    "pyarrow>=17",
    # Tokenizer-length checks in the correction / position stages.
    "transformers>=5.16",
    "sentencepiece",
    # Position clauses, multiview audit, masking: SAM3 subject detection, contact sheets.
    "sam3 @ git+https://github.com/facebookresearch/sam3.git",
    # sam3 under-declares what it imports; the next three rows are all "make `import sam3`
    # work". (1) sam3.model_builder does `import pkg_resources` at module scope, to locate the
    # CLIP bpe file, but never depends on setuptools -- and setuptools no longer ships
    # pkg_resources (84 has none), so any sam3 import dies with ModuleNotFoundError once torch
    # pulls a current setuptools in. Hold it on the last line that still has pkg_resources
    # (80.x; it warns) until sam3 moves to importlib.resources.
    "setuptools<81",
    # (2) sam3.model.edt `import triton`s at module scope, and the CUDA nms /
    # connected-components paths really do run triton kernels. PyPI triton is linux-only and
    # torch's win32 wheel doesn't pull one, so on Windows take the triton-windows build --
    # kept in step with the triton that torch 2.13 pairs with on linux (3.7.x). macOS has
    # no triton at all: masking/_sam3.py pre-seeds sam3.model.edt with a stand-in before the
    # sam3 import, since the image model never launches that kernel.
    "triton-windows>=3.7,<3.8; sys_platform == 'win32'",
    # (3) model_builder reaches into sam3.train.data and sam3.model.sam3_video_predictor,
    # which import pycocotools / psutil -- upstream declares pycocotools only under its `dev`
    # extra and psutil nowhere, so we bring both ourselves.
    "pycocotools>=2.0.8",
    "psutil",
    "matplotlib",
    # MIT/ComicTextDetector text masks.
    "segmentation-models-pytorch>=0.3.4",
    "albumentations>=1.4.0",
    "opencv-python>=4.11",
    # PP-OCRv6 text recognition, and the CTD text-mask gate (which alone would fall back to
    # cv2.dnn -- OCR has no fallback). The CPU and GPU builds are the same `import
    # onnxruntime` from two conflicting distributions, so the marker picks one per platform
    # rather than leaving it to the installer: onnxruntime-gpu publishes no macOS wheel, and
    # on linux/windows its CUDA + cuDNN libraries come from the nvidia-* wheels torch already
    # pulls in, which `_preload_cuda_libs` puts on the loader path. >=1.21 for `preload_dlls`.
    "onnxruntime>=1.21; sys_platform == 'darwin'",
    "onnxruntime-gpu>=1.21; sys_platform != 'darwin'",
    # Web GUI (`anime-tools-gui`): FastAPI + uvicorn; the server process never imports torch.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
anime-tools-gui = "anime_tools.gui:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist", "ruff", "httpx"]  # httpx: fastapi TestClient
# bench/ scripts (not installed; run from a checkout): scipy for the soft-prompt Hungarian match,
# cv2 / matplotlib for the MIT text-mask rows and contact sheets.
bench = ["scipy>=1.12"]
# `python -m anime_tools.tagger.cli.export_onnx` only: torch's exporter serializes through
# the `onnx` package and traces through `onnxscript`, and neither is needed to *run* the
# exported graph (that is onnxruntime, a plain dependency). The export is a one-time local
# build -- the dbv4 weights are gated and GPL, so the graph can never be shipped -- so the
# two stay out of the default sync: `uv sync --group export`.
export = ["onnx>=1.17", "onnxscript>=0.5"]

[tool.uv]
default-groups = ["dev"]
# sam3 pins numpy>=1.26,<2, but its tree is numpy-2 clean -- the pin is stale, not a real
# constraint. The only suspect usage is three `np.bool` calls in
# sam3/agent/helpers/visualizer.py, and numpy 2.0 restored `np.bool` as an alias for
# `np.bool_` (it was absent only in 1.24-1.26), so they work as-is. Nothing else in the tree
# touches a removed alias. Override the pin rather than fork; verified by importing
# sam3.model_builder / sam3.model.sam3_image_processor under numpy 2.4.
override-dependencies = ["numpy>=2.0"]

# No torch index is pinned here on purpose. Windows has no CUDA wheels on PyPI, but a
# `[tool.uv.sources]` torch index in this file leaks into every consumer that installs the
# package by path (the trainer's `anime-tools-dev` group) and collides with the consumer's
# own Windows backend selection (anima_lora resolves torch from cu132 or ROCm per group).
# The trainer owns the Windows backend; a standalone Windows install passes the index at
# sync time: `uv sync --index https://download.pytorch.org/whl/cu132`.

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anime_tools*"]

[tool.setuptools.package-data]
"anime_tools.captions" = ["data/*.yaml"]
"anime_tools.gui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
