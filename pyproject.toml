[project]
name = "anime-tools"
version = "0.6.5"
description = "Dataset curation for anime diffusion training: caption grammar + polishing, the Anima Tagger (dbv4), position clauses, multiview audit, PE-Spatial grouping, SAM3 masking."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "Pillow",
    "pyyaml",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "tqdm",
    "rich>=13",
    # Anima Tagger (dbv4 caformer backbone via timm; GPL weights fetched from the gated upstream repo at load)
    # + PE-Spatial grouping (vendored tower, weights fetched from the Hub at load).
    "torch>=2.12",
    "torchvision",
    "timm>=1.0",
    "einops",
    # The Danbooru wiki mirror (English tag descriptions) ships as one parquet;
    # `downloads.py`'s danbooru_tags_en row reads it directly rather than pulling
    # the whole `datasets` stack in for a single table.
    "pyarrow>=17",
    # Tokenizer-length checks in the correction / position stages.
    "transformers>=5.16",
    "sentencepiece",
    # The manga SFX reader (anime_tools.ocr.sfx) merges a LoRA onto PaddleOCR-VL-1.6.
    "peft>=0.20",
    # Position clauses, multiview audit, masking: SAM3 subject detection, contact sheets.
    "sam3 @ git+https://github.com/facebookresearch/sam3.git",
    # sam3 under-declares what it imports; the next three rows are all "make `import sam3`
    # work". (1) sam3.model_builder does `import pkg_resources` at module scope, to locate the
    # CLIP bpe file, but never depends on setuptools -- and setuptools no longer ships
    # pkg_resources (84 has none), so any sam3 import dies with ModuleNotFoundError once torch
    # pulls a current setuptools in. Hold it on the last line that still has pkg_resources
    # (80.x; it warns) until sam3 moves to importlib.resources.
    "setuptools<81",
    # (2) sam3.model.edt `import triton`s at module scope, and the CUDA nms /
    # connected-components paths really do run triton kernels. PyPI triton is linux-only and
    # torch's win32 wheel doesn't pull one, so on Windows take the triton-windows build --
    # kept in step with the triton that torch 2.13 pairs with on linux (3.7.x). macOS has
    # no triton at all: masking/_sam3.py pre-seeds sam3.model.edt with a stand-in before the
    # sam3 import, since the image model never launches that kernel.
    "triton-windows>=3.7,<3.8; sys_platform == 'win32'",
    # (3) model_builder reaches into sam3.train.data and sam3.model.sam3_video_predictor,
    # which import pycocotools / psutil -- upstream declares pycocotools only under its `dev`
    # extra and psutil nowhere, so we bring both ourselves.
    "pycocotools>=2.0.8",
    "psutil",
    "matplotlib",
    "opencv-python>=4.11",
    # Web GUI (`anime-tools-gui`): FastAPI + uvicorn; the server process never imports torch.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
anime-tools-gui = "anime_tools.gui:main"
# The double-clickable launcher for a dataset folder; the installers run it in theirs.
anime-tools-shortcut = "anime_tools.shortcut:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist", "ruff", "httpx"]  # httpx: fastapi TestClient
# bench/ scripts (not installed; run from a checkout): scipy for the soft-prompt Hungarian match,
# cv2 / matplotlib for the text-target rows and contact sheets.
bench = ["scipy>=1.12"]
# Windows checkout: torch from the cu132 index (see [tool.uv.sources]). A dependency
# group, not a bare source, so the index binds only when this project is the root --
# a consumer that installs anime-tools as a dependency never sees it.
cuda-windows = ["torch; sys_platform == 'win32'", "torchvision; sys_platform == 'win32'"]

[tool.uv]
default-groups = ["dev", "cuda-windows"]
# A torch index passed at sync time (`--index https://download.pytorch.org/whl/cpu`,
# what CI and the standalone Windows install use) becomes the FIRST index, and uv's
# default first-index-wins rule then pins every package that index happens to mirror
# to whatever version it carries -- even packages that have nothing to do with torch.
# The pytorch mirror stops at iopath 0.1.9 while sam3 needs >=0.1.10 (on PyPI), so the
# default strategy resolves iopath to a dead end instead of falling through. Both
# indexes are equally trusted here; consider versions from all of them (matches the
# trainer's [tool.uv] setting).
index-strategy = "unsafe-best-match"
# sam3 pins numpy>=1.26,<2, but its tree is numpy-2 clean -- the pin is stale, not a real
# constraint. The only suspect usage is three `np.bool` calls in
# sam3/agent/helpers/visualizer.py, and numpy 2.0 restored `np.bool` as an alias for
# `np.bool_` (it was absent only in 1.24-1.26), so they work as-is. Nothing else in the tree
# touches a removed alias. Override the pin rather than fork; verified by importing
# sam3.model_builder / sam3.model.sam3_image_processor under numpy 2.4.
override-dependencies = ["numpy>=2.0"]

# Windows draws torch from the pytorch index, because PyPI carries no win32 CUDA wheels -- a
# plain `uv sync` there lands `torch==...+cpu`, and then every stage silently runs on the CPU
# (`_device.py::resolve_device` probes `torch.cuda.is_available()`, gets False, falls through).
# Nothing in the package reports that; it just gets slow, so pin it here rather than rely on
# each checkout remembering `--index` at sync time.
#
# cu132 is the channel: it covers sm_120, and a 50-series card will not run on anything below
# cu128. The index is `explicit = true`, so it serves only the two packages bound to it below
# and the rest of the resolution never sees it -- that is what keeps the iopath dead end above
# from coming back through a second mirror. Both sources are `sys_platform == 'win32'`, so
# Linux and macOS still resolve torch from PyPI and CI's `--index .../whl/cpu` is untouched.
#
# Both sources are bound to the `cuda-windows` dependency group (default-on, so a checkout's
# `uv sync` gets them) and NOT declared bare: uv honors a git/path dependency's own
# `[tool.uv.sources]`, so a bare source here leaks into every consumer's resolution -- the
# trainer (anima_lora) locks anime-tools as a git dependency and selects its own Windows
# torch backend per group (cu132 or ROCm), and 0.6.1's bare source collided with its ROCm
# split at `uv lock`. Groups of a dependency are never enabled, so the group form cannot
# leak. The standalone install (`uv tool install`, which ignores groups) passes the index on
# the argv instead: `install.ps1` and `update.py` on win32.
#
# For a CPU or ROCm checkout on Windows: `uv sync --no-group cuda-windows --index <index>`.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'", group = "cuda-windows" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'", group = "cuda-windows" }]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anime_tools*"]

[tool.setuptools.package-data]
"anime_tools.captions" = ["data/*.yaml"]
"anime_tools.gui" = ["static/*", "guidebooks/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
