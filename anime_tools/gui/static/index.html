elp:"큐레이션 홈 기준 경로입니다; 트리들은 같은 상대 경로로 이어집니다. 도구는 워크스페이스에만 씁니다 — {0}은 Export만 건드립니다.",rootHelp:{src:"입력 — 원본 이미지와 손으로 쓴 master 캡션; 절대 쓰지 않습니다",master:"워크스페이스 — 수정한 master 캡션",dst:"워크스페이스 — 리사이즈된 이미지, derived 캡션, .variants.txt",masks:"워크스페이스 — {stem}_mask.png, 원본 하위 폴더 구조를 그대로 따릅니다",out:"출력 — Export가 내보내는 곳; 트레이너가 읽는 트리"},rootMissing:"없음 — ",stageDefaults:"스테이지 기본값",stageDefaultsHelp:"이 값을 받는 모든 스테이지에 채워지므로 각 폼이 다시 묻지 않습니다. 비워 두면 CLI 자체 기본값을 씁니다. {0}는 일부러 없습니다: 스테이지마다 알아서 잡습니다. {1}는 자기 플래그가 없는 유일한 값입니다: 스테이지마다 그 아래 자기 폴더({2}, {3})를 쓰므로, 루트를 옮기면 전부 함께 옮겨지면서도 두 스테이지가 한 리포트를 가리키는 일이 없습니다 — 큐레이션 감사 적용도 여기서 감사 리포트를 다시 읽습니다.",reportRootHint:"각 스테이지의 report.json이 떨어지는 곳 — 비우면 dst 루트 옆",maskRootHint:"각 생성기의 마스크 트리가 떨어지는 곳 — 비우면 병합이 채우는 masks 루트 옆",preprocessHelp:"스테이지가 다루는 바로 그 이미지들에 대해 돌아가므로, 이미지 하나만 Apply하면 그 이미지만 리사이즈됩니다. 이미 최신인 이미지는 건너뛰므로 다시 돌려도 거의 공짜입니다. 단계 값은 트레이너의 {0}와 맞아야 합니다.",hf:"Hugging Face",token:"토큰",tokenPlaceholder:"hf_… (huggingface_hub이 저장하며, 다시 보여주지 않습니다)",tokenHelp:"태거 백본과 SAM3 가중치는 허브에서 승인이 필요합니다 — 첫 실행에 읽기 권한 토큰이 필요합니다.",models:"모델",modelsHelp:"모든 스테이지는 처음 쓸 때 필요한 것을 스스로 받습니다 — 이 버튼은 그 기다림과 승인 거절을, 당신이 고른 순간으로 옮길 뿐입니다. 내려받기도 작업으로 돌아갑니다: 한 번에 하나씩이고, 스테이지 바가 아니라 여기에 보고하므로 이 창을 열어 둔 채로 둘 수 있습니다.",downloadAll:(e)=>`없는 모델 ${e}개 모두 받기`,allInstalled:"모든 모델이 설치되어 있습니다",download:"받기",redownload:"다시 받기",downloadingRow:"받는 중…",downloadPack:"팩 받기",redownloadPack:"팩 다시 받기",gated:"승인 필요 — 위 토큰과 같은 계정으로 {0}.",gatedLink:"약관에 동의"},stage:{panels:{Resize:"리사이즈",Autotag:"자동 태깅",Curate:"캡션 정리",OCR:"OCR 태깅",Groups:"그룹화",Masks:"마스크",Export:"내보내기"},titles:{resize:"버킷 크기로 리사이즈",autotag:"캡션 자동 태깅",position:"인물 위치 태깅",correct:"태그 교정",audit:"다중 시점 점검",ocr:"이미지 속 글자 인식",groups:"유사 이미지 그룹화",masks_sam:"SAM3 마스크",masks_merge:"마스크 합치기",export:"워크스페이스 내보내기"},shorts:{position:"인물 위치 태깅",correct:"태그 교정",audit:"점검",masks_sam:"설정",masks_merge:"합치기"},docs:{resize:`캡션 master를 모든 스테이지가 읽는 버킷 해상도 트리로 리사이즈합니다.

`+`다른 스테이지는 모두 --dst 아래를 훑기 때문에, --src 에만 있는 이미지는 그들에게 보이지 않습니다. 각 이미지는 가장 적게 줄어드는 --target_res 단계로 들어가고, 그 단계의 토큰 대역 안에서 원래 비율을 지킵니다. 기하는 트레이너의 make preprocess-resize와 같으므로, 어느 쪽이 먼저 돌든 나머지 한쪽은 건너뜁니다.

`+"항상 씁니다. 드라이런이 없고, 이미 목표 버킷에 있는 이미지는 다시 디코드하지 않고 건너뜁니다. glob은 --src 기준으로 맞춥니다.",autotag:`Anima Tagger로 데이터셋에 태그를 달아 revised 캡션을 씁니다.

`+`리사이즈된 트리를 훑으며 이미지마다 캡션을 제안합니다. --mode는 셋 중 하나입니다: missing(어떤 캡션도 설명하지 않는 이미지, 기본값), merge(절은 그대로 두고 새 태그만 덧붙이기), overwrite(캡션을 통째로 교체). 읽는 캡션은 revised이고 없으면 master로 넘어가며, 쓰는 캡션은 언제나 revised입니다. 그때 밀려난 텍스트는 {stem}.history.txt 버전으로 남습니다.

`+"기본은 드라이런이고 --apply가 씁니다. TE 캐시는 낡아도 겉보기에는 멀쩡하므로, 실제로 적용한 뒤에는 make preprocess-te를 이어서 도세요.",position:`여러 인물이 있는 캡션을 위치 절로 다시 씁니다 (SAM3 + Anima Tagger).

`+`리사이즈된 데이터셋 위에서 검출 → 정렬 → 자르고 지우기 → 태깅 → 조합 순으로 돌며, 귀속되는 태그를 평평한 태그 뭉치에서 자기 절로 옮깁니다(--flatten이 그 역방향 패스입니다). 절은 --dst 아래 revised 캡션에만 붙고, 캡션 master에는 손대지 않습니다. docs/position_captions.md를 보세요.

`+"기본은 드라이런이고 --apply가 씁니다. 이때 낡은 .variants.txt 사이드카를 지우므로, 뒤이어 TE 재인코딩을 도세요.",correct:`리사이즈된 전처리 이미지 옆에 교정한 캡션을 씁니다.

`+"revised 캡션을 제자리에서 교정하고, revised가 아직 없는 이미지에 대해서만 master를 읽습니다. 변형 사이드카는 선택입니다. 항상 씁니다: 드라이런도 리포트도 없습니다.",audit:`1girl 캡션 중 사실은 한 인물의 여러 시점인 이미지를 점검합니다.

`+`위치 스테이지가 single-subject로 건너뛴 이미지를 훑어, girl 프롬프트가 인물을 둘 이상 찾아내는 이미지를 모두 보고합니다. docs/multiview_audit.md를 보세요. 위치 스테이지는 --multiview_audit로 이 점검을 자기 첫 단계로 돌리며, 보통은 그쪽이 들어오는 길입니다.

`+"기본은 드라이런이고, --apply는 빠진 태그를 --dst 아래 revised 캡션에 씁니다. master에는 쓰지 않습니다. 뒤이어 TE 재인코딩을 도세요.",ocr:`이미지마다 그 안의 글자를 읽어 무엇이라고 쓰여 있는지 기록합니다.

`+`리사이즈된 트리를 훑으며 AnimeText 검출기(anime_tools.ocr.animetext, torch 위의 YOLO12. 첫 사용 때 54 MB를 받고, 가중치가 GPL-3.0이라 패키지에 넣지 않습니다)로 글자 블록마다 상자를 치고, 만화 VL 리더(anime_tools.ocr.sfx, 손으로 그린 효과음에 파인튜닝한 PaddleOCR-VL-1.6. torch, 첫 사용 때 약 2.8 GB)로 그 상자를 모두 읽어 {stem}.ocr.txt를 OCR 트리에 리사이즈된 트리와 같은 구조로 씁니다. 캡션은 읽지도 쓰지도 않으므로 뒤에 TE 재인코딩이 필요 없습니다.

`+`말풍선 대사와 그림 위에 그려진 효과음을 검출기 하나가 함께 잡습니다. 상자 하나의 읽기가 곧 한 줄이므로, 디코드 가드가 물리친 읽기는 그 상자째 버려집니다. --mask_dir을 주면 어떤 상자도 덮지 않은 텍스트 마스크 성분까지 따로 한 줄로 읽습니다(det 0.000). 줄마다 검출기의 상자 신뢰도(det)와 리더의 평균 토큰 신뢰도(score)가 붙습니다.

`+"기본은 드라이런입니다. 드라이런은 썼을 모든 줄을 담은 report.json을 남기고, --apply는 사이드카를 쓰는 것 말고는 아무것도 하지 않습니다.",groups:`PE-Spatial 시각 유사도로 데이터셋 이미지를 묶어 groups.json 매니페스트를 만듭니다.

`+"학습 전처리가 아니라 큐레이션 도구입니다: 작가별로 거의 같은 이미지들을 묶어 GUI 데이터셋 탭에서 그룹으로 걸러 볼 수 있게 할 뿐, 다른 것은 쓰지 않습니다. 두 이미지는 셀별 하한 --cell-match-min에서 match_frac가 --match-frac-min 이상일 때 묶입니다. 다시 돌리면 공유 PE-Spatial 특징 캐시를 재사용하므로 임계값을 다시 맞추는 일은 쌉니다.",masks_sam:`SAM3 마스크를 workspace/masks_sam/ 에 씁니다.

`+"--masks는 영역의 목록이고, 한 줄이 역할(남김/제외)과 종류(텍스트/소프트)와 값입니다. 남김 영역만 학습하고 그 밖은 모두 가립니다. 제외 영역은 거기서 다시 빠집니다(남김이 없으면 이미지 전체에서 빠집니다). 텍스트는 SAM3 텍스트 인코더를 거치는 프롬프트(speech bubble 등)이고, 소프트는 그 출력을 대신하는 학습된 프롬프트 파일(.safetensors)입니다. 기본값은 동봉된 소프트 프롬프트로 인물을 남기는 한 줄이고, 그 파일이 없으면 텍스트 프롬프트 girl로 대신합니다.",masks_merge:`여러 곳의 마스크를 픽셀별 최솟값으로 합칩니다(가려진 영역의 합집합).

`+"(rel_dir, name)을 키로 합치므로 입력마다 같은 상대 경로에 있는 마스크가 서로 만납니다. 중첩된 구조는 --output-dir 아래에 그대로 남습니다. 없는 입력 디렉터리는 오류가 아니라 건너뜀입니다 — 기본 입력은 생성기 한 곳의 트리이고, 두 번째 트리(손으로 칠한 마스크, 다른 도구의 출력)는 그 옆에 적어 두기만 하면 됩니다.",export:`워크스페이스를 트레이너가 읽는 경로로 내보냅니다.

`+`이 패키지에서 workspace/ 바깥에 쓰는 유일한 작업입니다: 리사이즈된 이미지와 마스크와 캡션이 --out 아래로 복사됩니다.

`+"기본은 드라이런입니다. --apply는 실제로 복사하면서 모든 줄을 목적지와 다시 견주므로, 드라이런 뒤에 편집된 파일은 덮이지 않고 보고됩니다. 내보낸 것을 되무르는 일은 여기 플래그가 아니라 GUI의 Undo입니다."},notes:{resize:"리사이즈된 트리를 읽는 모든 스테이지 앞에서 자동으로 실행됩니다. 여기 기본값이 그 모두에 적용됩니다.",autotag:"revised 캡션을 리사이즈된 트리 아래에 씁니다. master는 없을 때 대신 읽을 뿐 편집하지 않습니다. missing은 이미 캡션이 설명하는 이미지를 건너뜁니다.",correct:"revised 캡션을 제자리에서 교정합니다. master는 revised가 없는 이미지에서만 읽고, 편집하지 않습니다.",ocr:"{stem}.ocr.txt를 리사이즈된 트리와 같은 구조로 OCR 트리에 씁니다. 캡션은 읽지도 쓰지도 않습니다.",export:"워크스페이스 바깥에 쓰는 유일한 스테이지입니다. 실행하면 트레이너가 읽는 트리로 복사하고, 이미 같은 것은 건너뜁니다. Undo는 덮어쓴 텍스트를 되돌리지만, 교체된 픽셀은 되돌릴 수 없습니다."},run:"실행",runBatch:"일괄 실행",undo:"되돌리기",cancel:"중단",aim:(e)=>`${e} 하나만`,noImage:"먼저 사이드바에서 이미지를 고르세요",batchHint:"설정의 path_pattern이 가리키는 모든 이미지",undoHint:"마지막 실행이 쓴 캡션을 되돌립니다",missingModels:(e)=>`↓ 모델 ${e}개 없음`,missingModelsHint:(e)=>`아직 받지 않음: ${e}. 첫 실행이 알아서 받습니다 — 이 버튼은 그 기다림을 당신이 고른 순간으로 옮길 뿐입니다.`,noStages:"스테이지가 없습니다.",unavailable:(e,t)=>`${e}을(를) 쓸 수 없습니다: ${t}`,reinstall:"다시 설치:"},form:{options:"옵션",onePerLine:"한 줄에 하나씩",reset:"기본값으로 되돌리기",advanced:(e)=>`▸ 고급 (${e})`,advancedHide:"▾ 고급",advancedHint:"실행할 때마다 바꿀 일은 거의 없는 값들",advancedDirty:(e)=>`접혀 있는 값 ${e}개가 기본값이 아닙니다`,maskRoles:{keep:"남김",ignore:"제외"},maskKinds:{text:"텍스트",soft:"소프트"},maskRoleHint:"남김: 남긴 영역만 학습합니다 / 제외: 이 영역은 손실에서 빠집니다",maskKindHint:"텍스트: speech bubble 같은 SAM3 프롬프트 / 소프트: 학습된 프롬프트 파일(.safetensors)",maskTextPlaceholder:"SAM3 프롬프트 (예: speech bubble)",maskSoftPlaceholder:"소프트 프롬프트 .safetensors 경로",maskRemove:"이 마스크 빼기",maskAdd:"+ 마스크 추가",maskEmpty:"마스크 없음 — 실행하면 인물을 남기는 기본값으로 돌아갑니다"},runner:{nothingToUndo:"되돌릴 것이 없습니다",nothingApplied:"아직 실행한 것이 없습니다 — Undo는 실행이 쓴 내용을 되돌립니다",following:(e)=>`${e} 실행 중`,exit:(e)=>`종료 코드 ${e}`,changed:(e)=>`파일 ${e}개 변경`,undoing:"되돌리는 중…",undone:(e,t)=>`되돌림: ${e}개 복원, ${t}개 삭제`,skipped:(e)=>`— 건너뜀 ${e}`,logClosed:"로그 스트림이 닫혔습니다"},guide:{title:"가이드북",loading:"가이드북을 읽는 중…"},job:{log:"로그",logHint:"작업이 출력한 내용 전체",title:"작업 로그",empty:"아직 출력이 없습니다",of:(e,t)=>`${e} / ${t}`,step:(e,t,n)=>`단계 ${e}/${t} · ${n}`,tail :"点検",masks_sam:"設定",masks_merge:"統合"},docs:{resize:`キャプション master を、すべてのステージが読むバケット解像度のツリーへリサイズします。

`+`他のステージはどれも --dst の下を歩くので、--src にしかない画像はそれらから見えません。各画像は縮小がいちばん小さい --target_res の段に入り、その段のトークン帯の中で元の縦横比を保ちます。ジオメトリはトレーナーの make preprocess-resize と同じなので、どちらが先に走っても、もう片方はスキップします。

`+"常に書き込みます。ドライランはなく、すでに目的のバケットにある画像は再デコードせずスキップします。glob は --src を基準に照合します。",autotag:`Anima Tagger でデータセットにタグを付け、revised キャプションを書きます。

`+`リサイズ済みツリーを歩き、画像ごとにキャプションを提案します。--mode は三つ: missing(どのキャプションも語っていない画像、既定)、merge(句はそのままに新しいタグだけ足す)、overwrite(キャプションごと置き換える)。読むのは revised、無ければ master、書くのは常に revised で、そこで押し出されたテキストは {stem}.history.txt のバージョンとして残ります。

`+"既定はドライラン、--apply が書きます。TE キャッシュは古びても見た目は最新のままなので、実際に適用したら make preprocess-te を続けてください。",position:`複数の被写体があるキャプションを位置句へ書き直します(SAM3 + Anima Tagger)。

`+`リサイズ済みデータセットの上で 検出 → 並べ → 切り抜いて消し → タグ付け → 組み立て と進み、帰属できるタグを平らなタグの束からそれぞれの句へ移します(--flatten が逆向きのパスです)。句は --dst の下の revised キャプションに付き、キャプション master には触れません。docs/position_captions.md を参照。

`+"既定はドライラン、--apply が書き、古い .variants.txt サイドカーを落とすので、続けて TE の再エンコードを回してください。",correct:`リサイズ済みの前処理画像の隣に、補正したキャプションを書きます。

`+"revised キャプションをその場で補正し、revised がまだ無い画像についてだけ master を読みます。バリアントのサイドカーは任意です。常に書き込みます: ドライランもレポートもありません。",audit:`1girl のキャプションのうち、実は一人の複数視点である画像を点検します。

`+`位置ステージが single-subject として飛ばした画像をさらい、girl プロンプトが被写体を二つ以上見つけたものをすべて報告します。docs/multiview_audit.md を参照。位置ステージは --multiview_audit でこれを自分の最初のフェーズとして走らせ、普通はそちらが入口です。

`+"既定はドライラン。--apply は欠けたタグを --dst の下の revised キャプションへ書き、master には書きません。続けて TE の再エンコードを回してください。",ocr:`画像ごとに、その中の文字を読んで何と書いてあるかを記録します。

`+`リサイズ済みツリーを歩き、AnimeText 検出器(anime_tools.ocr.animetext、torch 上の YOLO12。初回に 54 MB を取得し、重みは GPL-3.0 なので同梱しません)で文字ブロックごとに箱を作り、マンガ VL リーダー(anime_tools.ocr.sfx、手描きの効果音でファインチューンした PaddleOCR-VL-1.6。torch、初回に約 2.8 GB)で箱をすべて読み、{stem}.ocr.txt を OCR ツリーへリサイズ済みツリーと同じ形で書きます。キャプションは読みも書きもせず、あとで TE の再エンコードも要りません。

`+`吹き出しの台詞と絵に描かれた効果音を、一つの検出器がまとめて拾います。箱ひとつの読みがそのまま一行なので、デコードガードが弾いた読みはその箱ごと落ちます。--mask_dir を渡すと、どの箱も覆っていないテキストマスクの成分も独立した行として読みます(det 0.000)。各行には検出器の箱の信頼度(det)とリーダーの平均トークン信頼度(score)が付きます。

`+"既定はドライラン: ドライランは書くはずだった行をすべて載せた report.json を残し、--apply はサイドカーを書くだけで他には何もしません。",groups:`PE-Spatial の見た目の近さでデータセットの画像をまとめ、groups.json マニフェストを書きます。

`+"学習の前処理ではなくキュレーションの道具です: 絵師ごとにほぼ同じ画像をクラスタし、GUI のデータセットタブでグループとして絞れるようにするだけで、ほかには何も書きません。二枚は、セルごとの下限 --cell-match-min のもとで match_frac が --match-frac-min 以上のときにまとまります。再実行は共有の PE-Spatial 特徴キャッシュを使い回すので、しきい値の詰め直しは安く済みます。",masks_sam:`SAM3 マスクを workspace/masks_sam/ に書きます。

`+"--masks は領域のリストで、一行が役割(残す/除外)と種類(テキスト/ソフト)と値です。残す領域だけを学習し、それ以外はすべて外します。除外の領域はそこからさらに外れます(残すものがなければ画像全体から外れます)。テキストは SAM3 のテキストエンコーダを通るプロンプト(speech bubble など)、ソフトはその出力の代わりになる学習済みプロンプトファイル(.safetensors)です。既定は同梱のソフトプロンプトで被写体を残す一行で、そのファイルがなければテキストプロンプト girl で代えます。",masks_merge:`複数の出どころのマスクを、画素ごとの最小値で統合します(マスク領域の和集合)。

`+"(rel_dir, name) をキーに統合するので、入力をまたいで同じ相対パスにあるマスクどうしが出会います。入れ子の形は --output-dir の下にそのまま残ります。無い入力ディレクトリはエラーではなくスキップ — 既定の入力は生成器ひとつのツリーで、二つ目のツリー(手で塗ったマスク、別のツールの出力)はその隣に並べるだけです。",export:`ワークスペースを、トレーナーが読むパスへ公開します。

`+`このパッケージで workspace/ の外に書く唯一の操作です: リサイズ済みの画像とマスクとキャプションが --out の下へコピーされます。

`+"既定はドライラン。--apply は実際にコピーしつつ、一行ごとに宛先と照らし直すので、ドライラン後に編集されたファイルは上書きではなく報告されます。書き出しを取り消すのは、ここのフラグではなく GUI の Undo です。"},notes:{resize:"リサイズ済みツリーを読むステージすべての前で自動的に走ります。ここの既定値はそのすべてに効きます。",autotag:"revised キャプションをリサイズ済みツリーの下に書きます。master は無いときに読むだけで、編集しません。missing はすでにキャプションが語っている画像を飛ばします。",correct:"revised キャプションをその場で補正します。master は revised が無い画像でだけ読み、編集はしません。",ocr:"{stem}.ocr.txt を、リサイズ済みツリーと同じ形で OCR ツリーへ書きます。キャプションは読みも書きもしません。",export:"ワークスペースの外に書く唯一のステージです。実行するとトレーナーが読むツリーへコピーし、すでに同じものは飛ばします。Undo は上書きしたテキストを戻しますが、置き換わった画素は戻せません。"},run:"実行",runBatch:"一括実行",undo:"元に戻す",cancel:"中止",aim:(e)=>`${e} だけ`,noImage:"先にサイドバーで画像を選んでください",batchHint:"設定の path_pattern が指すすべての画像",undoHint:"直前の実行が書いたキャプションを戻します",missingModels:(e)=>`↓ モデル ${e} 件が未取得`,missingModelsHint:(e)=>`未取得: ${e}。最初の Run が自分で取得します — このボタンは待ち時間をあなたが選んだ瞬間に移すだけです。`,noStages:"ステージがありません。",unavailable:(e,t)=>`${e} は使えません: ${t}`,reinstall:"再インストール:"},form:{options:"オプション",onePerLine:"1 行に 1 つ",reset:"既定値に戻す",advanced:(e)=>`▸ 詳細 (${e})`,advancedHide:"▾ 詳細",advancedHint:"実行のたびに変えることはまずない項目",advancedDirty:(e)=>`折りたたまれた項目のうち ${e} 個が既定値ではありません`,maskRoles:{keep:"残す",ignore:"除外"},maskKinds:{text:"テキスト",soft:"ソフト"},maskRoleHint:"残す: 残した領域だけを学習します / 除外: この領域は損失から外れます",maskKindHint:"テキスト: speech bubble のような SAM3 プロンプト / ソフト: 学習済みプロンプトファイル(.safetensors)",maskTextPlaceholder:"SAM3 プロンプト (例: speech bubble)",maskSoftPlaceholder:"ソフトプロンプトの .safetensors パス",maskRemove:"このマスクを外す",maskAdd:"+ マスクを追加",maskEmpty:"マスクなし — 実行すると被写体を残す既定に戻ります"},runner:{nothingToUndo:"戻すものがありません",nothingApplied:"まだ実行していません — Undo は実行が書いた内容を戻します",following:(e)=>`${e} を実行中`,exit:(e)=>`終了コード ${e}`,changed:(e)=>`ファイル ${e} 件を変更`,undoing:"戻しています…",undone:(e,t)=>`戻しました: ${e} 件復元、${t} 件削除`,skipped:(e)=>`— 飛ばした ${e}`,logClosed:"ログのストリームが閉じました"},guide:{title:"ガイドブック",loading:"ガイドブックを読み込み中…"},job:{log:"ログ",logHint:"ジョブが出力した内容すべて",title:"ジョブログ",empty:"まだ出力がありません",of:(e,t)=>`${e} / ${t}`,step:(e,t,n)=>`ステップ ${e}/${t} · ${n}`,tail:(e)=>`最後の ${e} 行だけを表示しています`},downloads:{starti 有掩码目录的落点 — 留空则放在合并所填充的 masks 根目录旁",preprocessHelp:"它处理的图片和阶段完全相同，因此对单张图片 Apply 只会缩放那一张。已经是最新的图片会跳过，所以重跑几乎不花代价。档位必须与训练器的 {0} 一致。",hf:"Hugging Face",token:"令牌",tokenPlaceholder:"hf_…（由 huggingface_hub 保存，不会再次显示）",tokenHelp:"打标模型主干和 SAM3 权重在 Hub 上需要授权 — 首次运行需要一个有读取权限的令牌。",models:"模型",modelsHelp:"每个阶段首次使用时会自行下载所需内容 — 这些按钮只是把等待，以及授权仓库可能的拒绝，挪到你挑好的时刻。下载也是一个任务：一次一个，并且报告在这里而不是阶段栏，所以这个对话框可以一直开着。",downloadAll:(e)=>`下载全部 ${e} 个缺失模型`,allInstalled:"所有模型都已安装",download:"下载",redownload:"重新下载",downloadingRow:"下载中…",downloadPack:"下载整包",redownloadPack:"重新下载整包",gated:"需要授权 — 请用与上面令牌相同的账号{0}。",gatedLink:"接受条款"},stage:{panels:{Resize:"缩放",Autotag:"自动标签",Curate:"标注整理",OCR:"OCR 标注",Groups:"分组",Masks:"掩码",Export:"导出"},titles:{resize:"缩放到桶尺寸",autotag:"自动生成标签",position:"人物位置标注",correct:"标签校正",audit:"多视角审查",ocr:"识别图中文字",groups:"相似图片分组",masks_sam:"SAM3 掩码",masks_merge:"合并掩码",export:"导出工作区"},shorts:{position:"人物位置标注",correct:"标签校正",audit:"审查",masks_sam:"设置",masks_merge:"合并"},docs:{resize:`把标注 master 缩放进每个阶段都会读的桶分辨率树。

`+`其他阶段一律走 --dst，所以只存在于 --src 里的图片对它们是看不见的。每张图落进缩得最少的那一档 --target_res，并在该档的 token 带宽内保持原有比例；几何与训练器的 make preprocess-resize 一致，所以谁先跑，另一边就跳过。

`+"总是写入；没有试运行，已经在目标桶里的图片不会重新解码，直接跳过。glob 按 --src 匹配。",autotag:`用 Anima Tagger 给数据集打标签，并写入 revised 标注。

`+`遍历缩放树，为每张图提出一份标注，--mode 有三种：missing（没有任何标注说到的图片，默认）、merge（保留从句，只补上新标签）、overwrite（整份替换）。读的是 revised，没有就退回 master；写的永远是 revised，被顶掉的文本作为 {stem}.history.txt 的一个版本留下。

`+"默认试运行，--apply 才写。TE 缓存会过期却看着像新的，所以真正应用之后请接着跑 make preprocess-te。",position:`把多主体的标注改写成位置从句（SAM3 + Anima Tagger）。

`+`在缩放后的数据集上按 检测 → 排序 → 裁剪并抹除 → 打标签 → 组合 推进，把每个可归属的标签从扁平的标签袋移进它自己的从句（--flatten 是反向的一遍）。从句只落在 --dst 下的 revised 标注上，绝不落在标注 master 上。见 docs/position_captions.md。

`+"默认试运行，--apply 才写，并且会丢掉过期的 .variants.txt 附文件，所以之后请重新跑一次 TE 编码。",correct:`在缩放后的预处理图片旁边写下校正过的标注。

`+"就地校正 revised 标注，只有当一张图还没有 revised 时才去读 master，变体附文件是可选的。总是写入：没有试运行，也没有报告。",audit:`审查 1girl 的标注，找出其实是同一个人多个视角的图片。

`+`扫过位置阶段以 single-subject 跳过的图片，把 girl 提示词找到两个以上主体的全部报告出来。见 docs/multiview_audit.md。位置阶段用 --multiview_audit 把这一步当作自己的第一个阶段来跑，平常都是从那儿进来的。

`+"默认试运行；--apply 会把缺的标签写进 --dst 下的 revised 标注，不写 master，之后请重新跑一次 TE 编码。",ocr:`读出每张图里的文字，并记下它写了什么。

`+`遍历缩放树，用 AnimeText 检测器（anime_tools.ocr.animetext，torch 上的 YOLO12；首次使用下载 54 MB，权重是 GPL-3.0，从不随包分发）框出每一块文字，再用漫画 VL 阅读器（anime_tools.ocr.sfx，在手写拟声词上微调过的 PaddleOCR-VL-1.6；torch，首次使用约 2.8 GB）读出每个框，把 {stem}.ocr.txt 写进 OCR 树，布局与缩放树一致。不读也不写任何标注，之后也不需要重新编码 TE。

`+`对白框里的台词和画在画面上的拟声词由同一个检测器一起框。一个框的读取就是一行，所以被解码守卫挡下的读取会连框一起丢掉。给了 --mask_dir，文字掩码里没有被任何框覆盖的连通块也会当作独立的行读出来（det 0.000）。每一行都带着检测器的框置信度（det）和阅读器的平均 token 置信度（score）。

`+"默认试运行：试运行会留下一份 report.json，装着它本来要写的每一行；--apply 只写附文件，别的什么都不做。",groups:`按 PE-Spatial 的视觉相似度把数据集里的图片分组，写出 groups.json 清单。

`+"这是一件策展工具，不是训练的预处理步骤：它按画师把几乎相同的图片聚在一起，好让 GUI 的数据集页可以按分组筛选，除此之外什么都不写。两张图在每格下限 --cell-match-min 之下、match_frac 达到 --match-frac-min 时归为一组。重跑会复用共享的 PE-Spatial 特征缓存，所以重新调阈值很便宜。",masks_sam:`SAM3 掩码，写到 workspace/masks_sam/。

`+"--masks 是一组区域，每一行是角色（保留/排除）、种类（文本/软提示）和值。只训练保留的区域，其余全部掩掉；排除的区域再从中去掉（没有保留时就从整张图里去掉）。文本是走 SAM3 文本编码器的提示词（如 speech bubble），软提示是替代其输出的学出来的提示文件（.safetensors）。默认是一行用自带软提示保留主体；那个文件不在时改用文本提示词 girl。",masks_merge:`把多个来源的掩码按像素取最小值合并（掩码区域的并集）。

`+"以 (rel_dir, name) 为键合并，所以各输入里相对路径相同的掩码会碰到一起；嵌套的结构在 --output-dir 下原样保留。输入目录不存在是跳过而不是报错 —— 默认的输入是某一个生成器的树，第二棵树（手绘的掩码、另一个工具的输出）只要列在旁边就行。",export:`把工作区发布到训练器读取的路径。

`+`这是本包里唯一写到 workspace/ 之外的操作：缩放后的图片、掩码和标注都会复制到 --out 之下。

`+"默认试运行。--apply 会真的复制，并且对每一行重新对照目的地判断，所以试运行之后被改过的文件会被报告而不是被覆盖。把一次导出收回去靠的是 GUI 的 Undo，不是这里的某个开关。"},notes:{resize:"在每个读取缩放树的阶段之前自动运行。这里的默认值对它们全都生效。",autotag:"把 revised 标注写在缩放树下；master 只在缺少时读取，从不改动。missing 会跳过标注已经说到的图片。",correct:"就地校正 revised 标注；master 只在还没有 revised 的图片上读取，从不改动。",ocr:"把 {stem}.ocr.txt 写进 OCR 树，布局与缩放树一致。不读也不写任何标注。",export:"唯一写到工作区之外的阶段：运行会复制到训练器读取的那棵树，已经一样的就跳过。Undo 能还原它覆盖掉的文本；被替换的像素无法撤销。"},run:"运行",runBatch:"批量运行",undo:"撤销",cancel:"中止",aim:(e)=>`仅 ${e}`,noImage:"请先在侧栏选择一张图片",batchHint:"设置里 path_pattern 匹配到的每一张图片",undoHint:"把上一次运行写下的标注放回去",missingModels:(e)=>`↓ 缺 ${e} 个模型`,missingModelsHint:(e)=>`尚未下载：${e}。第一次 Run 会自行获取 — 这个按钮只是把等待挪到你挑好的时刻。`,noStages:"没有阶段。",unavailable:(e,t)=>`${e} 不可用：${t}`,reinstall:"重新安装："},form:{options:"选项",onePerLine:"每行一个",reset:"恢复默认值",advanced:(e)=>`▸ 高级 (${e})`,advancedHide:"▾ 高级",advancedHint:"每次运行几乎不会改动的参数",advancedDirty:(e)=>`已折叠的 ${e} 项不是默认值`,maskRoles:{keep:"保留",ignore:"排除"},maskKinds:{text:"文本",soft:"软提示"},maskRoleHint:"保留：只训练保留的区域 / 排除：这块区域不计入损失",maskKindHint:"文本：像 speech bubble 这样的 SAM3 提示词 / 软提示：学出来的提示文件（.safetensors）",maskTextPlaceholder:"SAM3 提示词（例：speech bubble）",maskSoftPlaceholder:"软提示 .safetensors 路径",maskRemove:"去掉这个掩码",maskAdd:"+ 添加掩码",maskEmpty:"没有掩码 —— 运行时回到保留主体的默认值"},runner:{nothingToUndo:"没有可撤销的内容",nothingApplied:"还没有运行过 — Undo 撤销的是一次运行写下的内容",following:(e)=>`正在运行 ${e}`,exit:(e)=>`退出码 ${e}`,changed:(e)=>`${e} 个文件已变更`,undoing:"撤销中…",undone:(e,t)=>`已撤销：恢复 ${e} 项，删除 ${t} 项`,skipped:(e)=>`— 跳过 ${e}`,logClosed:"日志流已关闭"},guide:{title:"指南书",loading:"正在读取指南书…"},job:{log:"日志",logHint:"任务输出的全部内容",title:"任务日志",empty:"还没有输出",of:(e,t)=>`${e} / ${t}`,step:(e,t,n)=>`步骤 ${e}/${t} · ${n}`,tail:(e)=>`只显示最后 ${e} 行`},downloads:{starting:"开始中…",finished:"下载完成"},update:{version:"版本",help:"面板会向 GitHub 查询最新发行版，并把结果缓存六小时 — 刷新页面不会每次都发出请求。更新会替换本服务器所在的环境：不会写入数据集，但完成后需要重启 GUI。",installed:"已安装",latest:"最新发行版",never:"尚未检查",viewRelease:"发行页 ↗",checking:"检查中…",checkNow:"立即检查",checkedAt:(e)=>`已于 ${e} 检查`,checkFailed:(e)=>`检查失败：${e}`,state:
