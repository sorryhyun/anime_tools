name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@v2
      # The built frontend is committed; rebuild and refuse to release a stale one.
      - run: scripts/build_frontend.sh
      - run: git diff --exit-code -- anime_tools/gui/static/
      - run: uv build
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            install.sh
            install.ps1
            dist/*.whl
            dist/*.tar.gz
